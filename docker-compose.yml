services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-backend
    networks:
      - app-net
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
      - ./infra/telemetry_config.json:/etc/telemetry/telemetry_config.json:ro
    environment:
      - BOOTSTRAP_DATA=${BOOTSTRAP_DATA:-true}
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - ADMIN_DB_PATH=/data/config/admin.sqlite
      - RULES_DB_PATH=/data/config/rules.sqlite
      - TOPOLOGY_DB_PATH=/data/grid_topology.sqlite
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=${CIMG_USERNAME:-neo4j}
      - CIMG_PASSWORD=${CIMG_PASSWORD:-password123}
      - CIMG_DATABASE=${CIMG_DATABASE:-neo4j}
      - CIMG_CIM_PROFILE=${CIMG_CIM_PROFILE:-cimhub_2023}
      - CIMG_IEC61970_301=${CIMG_IEC61970_301:-8}
      - CIM_MODEL_NAMES=${CIM_MODEL_NAMES:-IEEE8500}
      - TELEMETRY_CONFIG_PATH=/etc/telemetry/telemetry_config.json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - DUCKDB_THREADS=2
      - DUCKDB_MEMORY_LIMIT=3GB
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4GB

  frontend:
    build:
      context: ./frontend
    container_name: grid-frontend
    networks:
      - app-net
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  maintenance:
    image: nginx:alpine
    profiles: [ "maintenance" ]
    container_name: grid-maintenance
    networks:
      - app-net
    volumes:
      - ./maintenance:/usr/share/nginx/html:ro
    ports:
      - "${MAINTENANCE_PORT:-8081}:80"
    restart: unless-stopped

  documentation:
    build:
      context: ./docs
    container_name: grid-docs
    networks:
      - app-net
    ports:
      - "${WEBSITE_PORT:-3002}:3000"
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-generator
    networks:
      - app-net
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
    entrypoint: [ "sh", "./scripts/bootstrap.sh" ]
    environment:
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - ADMIN_DB_PATH=/data/config/admin.sqlite
      - RULES_DB_PATH=/data/config/rules.sqlite
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=${CIMG_USERNAME:-neo4j}
      - CIMG_PASSWORD=${CIMG_PASSWORD:-password123}
      - REFRESH_DB=${REFRESH_DB:-false}
    depends_on:
      neo4j:
        condition: service_healthy
    profiles: [ "tools" ]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  admin-backend:
    build:
      context: ./admin-console/admin-backend
    container_name: grid-admin-backend
    networks:
      - app-net
      - admin-net
    volumes:
      - grid_config:/data/config
      - ./infra:/infra
      - ./ingest:/data/ingest
    environment:
      - ADMIN_CONSOLE_PORT=8090
      - ADMIN_DB_PATH=/data/config/admin.sqlite
      - RULES_DB_PATH=/data/config/rules.sqlite
      - MAIN_BACKEND_URL=http://backend:8000
      - INFRA_DIR=/infra
      - INGEST_DIR=/data/ingest
      - TELEMETRY_CONFIG_PATH=/infra/telemetry_config.json
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    ports:
      - "${ADMIN_BACKEND_PORT:-8090}:8090"
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-console/admin-frontend
    container_name: grid-admin-frontend
    networks:
      - admin-net
    ports:
      - "${ADMIN_FRONTEND_PORT:-8091}:80"
    depends_on:
      - admin-backend
    restart: unless-stopped

  neo4j:
    build: ./neo4j
    container_name: grid-neo4j
    networks:
      - app-net
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password123}
      - NEO4J_dbms_security_procedures_unrestricted=n10s.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=n10s.*,apoc.*
      - NEO4J_server_unmanaged__extension__classes=n10s.endpoint=/rdf
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./backend/cim:/var/lib/neo4j/import/cim
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-ingestor
    networks:
      - app-net
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
      - ./backend/cim/models:/app/cim/models
      - ./ingest:/data/ingest
      - ./archive:/data/archive
    entrypoint: [ "python", "scripts/monitor_and_ingest.py" ]
    environment:
      - INGEST_DIR=/data/ingest
      - ARCHIVE_DIR=/data/archive
      - MODELS_DIR=/app/cim/models
      - INGEST_SCRIPT=/app/scripts/ingest_cim_to_neo4j.py
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=${CIMG_USERNAME:-neo4j}
      - CIMG_PASSWORD=${CIMG_PASSWORD:-password123}
      - CIMG_CIM_PROFILE=${CIMG_CIM_PROFILE:-cimhub_2023}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grid-grafana
    networks:
      - app-net
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  loki:
    image: grafana/loki:latest
    container_name: grid-loki
    networks:
      - app-net
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  tempo:
    image: grafana/tempo:latest
    container_name: grid-tempo
    networks:
      - app-net
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo/tempo.yaml
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200" # HTTP
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  alloy:
    image: grafana/alloy:latest
    container_name: grid-alloy
    networks:
      - app-net
    volumes:
      - ./infra/alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  app-net:
    driver: bridge
  admin-net:
    driver: bridge

volumes:
  grid_data:
  grid_config:
  neo4j_data:
  neo4j_logs:
