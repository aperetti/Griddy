services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-backend
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
    environment:
      - BOOTSTRAP_DATA=${BOOTSTRAP_DATA:-true}
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - ADMIN_DB_PATH=/data/config/admin_config.db
      - CONFIG_DB_PATH=/data/config/admin_config.db
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=neo4j
      - CIMG_PASSWORD=password123
      - CIMG_CIM_PROFILE=cimhub_2023
      - CIMG_IEC61970_301=8
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'

  frontend:
    build:
      context: ./frontend
    container_name: grid-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  documentation:
    build:
      context: ./docs
    container_name: grid-docs
    ports:
      - "${WEBSITE_PORT:-3002}:3000"
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-generator
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
    entrypoint: [ "sh", "./scripts/bootstrap.sh" ]
    environment:
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - ADMIN_DB_PATH=/data/config/admin_config.db
      - CONFIG_DB_PATH=/data/config/admin_config.db
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=neo4j
      - CIMG_PASSWORD=password123
      - REFRESH_DB=${REFRESH_DB:-false}
    profiles: [ "tools" ]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  admin-backend:
    build:
      context: ./admin-console/admin-backend
    container_name: grid-admin-backend
    volumes:
      - grid_config:/data/config
    environment:
      - ADMIN_CONSOLE_PORT=8090
      - ADMIN_DB_PATH=/data/config/admin_config.db
      - DB_PATH=/data/config/admin_config.db
    ports:
      - "${ADMIN_BACKEND_PORT:-8090}:8090"
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-console/admin-frontend
    container_name: grid-admin-frontend
    ports:
      - "${ADMIN_FRONTEND_PORT:-8091}:80"
    depends_on:
      - admin-backend
    restart: unless-stopped

  neo4j:
    build: ./neo4j
    container_name: grid-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/password123}
      - NEO4J_dbms_security_procedures_unrestricted=n10s.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=n10s.*,apoc.*
      - NEO4J_server_unmanaged__extension__classes=n10s.endpoint=/rdf
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./backend/cim:/var/lib/neo4j/import/cim
    restart: unless-stopped

  ingestor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grid-ingestor
    volumes:
      - grid_data:/data
      - grid_config:/data/config
      - ./backend:/app
      - ./backend/cim:/app/cim
      - ./backend/cim/models:/app/cim/models
      - ./ingest:/data/ingest
      - ./archive:/data/archive
    entrypoint: [ "python", "scripts/monitor_and_ingest.py" ]
    environment:
      - INGEST_DIR=/data/ingest
      - ARCHIVE_DIR=/data/archive
      - MODELS_DIR=/app/cim/models
      - INGEST_SCRIPT=/app/scripts/ingest_cim_to_neo4j.py
      - CIMG_URL=bolt://neo4j:7687
      - CIMG_USERNAME=neo4j
      - CIMG_PASSWORD=password123
      - CIMG_CIM_PROFILE=cimhub_2023
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  grid_data:
  grid_config:
  neo4j_data:
  neo4j_logs:
