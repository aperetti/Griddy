services:
  backend:
    build:
      context: ./backend
    container_name: grid-backend
    volumes:
      - grid_data:/data
      - grid_config:/data/config:ro
      - ./backend:/app
      - ./backend/cim:/app/cim
    environment:
      - BOOTSTRAP_DATA=${BOOTSTRAP_DATA:-true}
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - CONFIG_DB_PATH=/data/config/admin_config.db
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'

  frontend:
    build:
      context: ./frontend
    container_name: grid-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

  documentation:
    build:
      context: ./docs
    container_name: grid-docs
    ports:
      - "${WEBSITE_PORT:-3002}:3000"
    restart: unless-stopped

  generator:
    build:
      context: ./backend
    container_name: grid-generator
    volumes:
      - grid_data:/data
      - grid_config:/data/config:ro
      - ./backend:/app
      - ./backend/cim:/app/cim
    environment:
      - DB_PATH=/data/grid_data_cim.duckdb
      - PARQUET_DIR=/data/cim_readings
      - CONFIG_DB_PATH=/data/config/admin_config.db
      - CIM_MODEL_PATH=/app/cim/IEEE8500.xml
      - WEATHER_DATA_PATH=/app/cim/weather.epw
    entrypoint: [ "sh", "./scripts/bootstrap.sh" ]
    profiles: [ "tools" ]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  admin-backend:
    build:
      context: ./admin-console/admin-backend
    container_name: grid-admin-backend
    volumes:
      - grid_config:/data/config
    environment:
      - ADMIN_CONSOLE_PORT=8090
      - DB_PATH=/data/config/admin_config.db
    ports:
      - "${ADMIN_BACKEND_PORT:-8090}:8090"
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-console/admin-frontend
    container_name: grid-admin-frontend
    ports:
      - "${ADMIN_FRONTEND_PORT:-8091}:80"
    environment:
      - VITE_ADMIN_API_URL=http://localhost:8090/api
    depends_on:
      - admin-backend
    restart: unless-stopped

volumes:
  grid_data:
  grid_config:
